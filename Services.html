    <header>

    <main>
        <div class="container">
            <h2>Load Your Mobile</h2>
            <form>
                <input type="text" placeholder="Mobile Number" required>
                <select required>
                    <option value="" disabled selected>Select Network</option>
                    <option value="network1">SMART</option>
                    <option value="network2">DITO</option>
                    <option value="network3">TNT</option>
                </select>
                <button type="submit">Load Now</button>
            </form>
