<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Loading Business - Enter Values</title>
    <link rel="stylesheet" href="ContStyle.css">
</head>
<body>
    <header>
        <h1>E-Loading Business</h1>
        <nav>
            <ul>
                <li><a href="website.html" class="button">Home</a></li>
                <li><a href="About.html" class="button">About</a></li>
                <li><a href="Services.html" class="button">Services</a></li>
                <li><a href="Contact.html" class="button">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Load List</h2>
            <form id="value-form">
                <input type="number" id="value-input" placeholder="Enter value" required>
                <select id="network-input" required>
                    <option value="" disabled selected>Select Network</option>
                    <option value="network1">Smart</option>
                    <option value="network2">TNT</option>
                    <option value="network3">Globe</option>
                    <option value="network3">DITO</option>
                </select>
                <div class="checkbox-container">
                    <label for="paid">
                        <input type="checkbox" id="paid"> Paid
                    </label>
                </div>
                <button type="submit">Add Value</button>
            </form>
        </div>
        <div class="values-container">
            <div class="values-list">
                <h3>Listed Values</h3>
                <ul id="values-list">
                    <!-- Dynamic list of values will be inserted here -->
                </ul>
                <p>Total: <span id="total-value">0</span></p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 E-Loading Business. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('value-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const valueInput = document.getElementById('value-input');
            const networkInput = document.getElementById('network-input');
            const paidInput = document.getElementById('paid');
            const value = parseFloat(valueInput.value);
            const network = networkInput.value;
            const paid = paidInput.checked ? 'Yes' : 'No';
            const valuesList = document.getElementById('values-list');
            const totalValueElem = document.getElementById('total-value');
            const currentDate = new Date();
            const month = currentDate.toLocaleString('default', { month: 'long' });

            const listItem = document.createElement('li');
            listItem.textContent = `Value: ${value}, Network: ${network}, Paid: ${paid} - Month: ${month}`;
            valuesList.appendChild(listItem);

            const currentTotal = parseFloat(totalValueElem.textContent);
            totalValueElem.textContent = currentTotal + value;

            valueInput.value = '';
            networkInput.value = '';
            paidInput.checked = false;
        });
    </script>
</body>
</html>
